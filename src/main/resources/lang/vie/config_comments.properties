# Nukkit-MOT YAML config comments - Tiếng Việt

# Nhãn danh mục
performanceSettings=Cài đặt hiệu năng và đa luồng
networkSettings=Cài đặt mạng và nén
chunkSettings=Chunk loading and ticking settings
entitySettings=Entity spawning and AI settings
worldSettings=Cài đặt thế giới và chiều không gian
playerSettings=Dữ liệu người chơi và cài đặt tương tác
debugSettings=Debug, logging and metrics settings
gameFeatureSettings=Công tắc tính năng trò chơi
neteaseSettings=Cài đặt hỗ trợ NetEase

# Hiệu năng
performanceSettings.asyncWorkers=Số lượng luồng xử lý bất đồng bộ (auto = số lõi CPU + 1)
performanceSettings.autoTickRate=Automatically adjust tick rate based on server load
performanceSettings.autoTickRateLimit=Maximum tick rate when auto-adjusting
performanceSettings.baseTickRate=Base tick rate (1 = normal speed)
performanceSettings.alwaysTickPlayers=Always tick players even when far from spawn
performanceSettings.threadWatchdog=Enable thread watchdog
performanceSettings.threadWatchdogTick=Thread watchdog check interval (ms)
performanceSettings.doLevelGc=Enable level garbage collection
performanceSettings.ticksPerAutosave=Ticks between auto-saves (6000 = 5 minutes)
performanceSettings.levelAutoCompaction=Enable automatic level compaction
performanceSettings.levelAutoCompactionTicks=Ticks between compaction runs (36000 = 30 minutes)
performanceSettings.leveldbCacheMb=LevelDB cache size in MB
performanceSettings.useNativeLeveldb=Use native LevelDB library
performanceSettings.enableSpark=Bật Spark profiler

# Mạng
networkSettings.zlibProvider=ZLIB compression provider (2 recommended)
networkSettings.compressionLevel=Compression level (1-9, higher = more CPU, smaller packets)
networkSettings.chunkCompressionLevel=Chunk compression level (1-9, higher = more CPU, smaller chunks)
networkSettings.compressionThreshold=Compression threshold in bytes
networkSettings.useSnappyCompression=Use Snappy compression instead of ZLIB
networkSettings.rakPacketLimit=Max RakNet packets per 10ms per IP
networkSettings.rakCookieMode=RakNet cookie mode (active, offloaded, offloaded_psk, off, none, stateless)
networkSettings.timeoutMilliseconds=Client timeout in milliseconds
networkSettings.queryPlugins=Show plugin list in query response
networkSettings.useWaterdog=Enable WaterDog proxy mode
networkSettings.viaProxyUsernamePrefix=ViaProxy Java Edition player username prefix
networkSettings.enableProxyProtocol=Enable Proxy Protocol v2 for UDP proxies (e.g. FRP). Whitelisted sources must send a valid PPv2 header; non-whitelisted sources are treated as direct clients
networkSettings.proxyProtocolWhitelist=Whitelisted proxy source IPv4/IPv6 CIDR entries for Proxy Protocol. Use proxy addresses, not player addresses. IPv6 local addresses are trusted by default. Headerless or invalid packets from whitelisted sources are dropped

# Chunk
chunkSettings.sendingPerTick=Chunks to send per tick
chunkSettings.tickingPerTick=Chunks to tick per tick
chunkSettings.tickingRadius=Chunk ticking radius around players
chunkSettings.generationQueueSize=Chunk generation queue size
chunkSettings.generationPopulationQueueSize=Chunk population queue size
chunkSettings.lightUpdates=Enable dynamic light updates
chunkSettings.clearChunkTickList=Clear chunk tick list on save
chunkSettings.spawnThreshold=Spawn threshold for chunk loading
chunkSettings.cacheChunks=Cache chunks in memory
chunkSettings.asyncChunks=Use async chunk loading, sending and saving
chunkSettings.maxPendingChunkWrites=Max pending chunk writes per world before unloading pauses (backpressure)

# Thực thể
entitySettings.spawnEggs=Cho phép sử dụng trứng sinh vật
entitySettings.mobAi=Bật AI của mob (tìm đường, chọn mục tiêu, v.v.)
entitySettings.autoSpawnTask=Bật tác vụ tự động spawn entity
entitySettings.despawnTask=Bật tác vụ tự động despawn entity
entitySettings.ticksPerSpawns=Số tick giữa mỗi lần thử spawn entity
entitySettings.ticksPerDespawns=Số tick giữa mỗi lần kiểm tra despawn entity

# Thế giới
worldSettings.nether=Kích hoạt chiều không gian Nether
worldSettings.end=Kích hoạt chiều không gian End
worldSettings.vanillaPortals=Bật cơ chế cổng mặc định
worldSettings.portalTicks=Ticks to wait in portal before teleporting
worldSettings.multiNetherWorlds=Worlds that should have their own nether dimensions, otherwise using the default nether world
worldSettings.antiXrayWorlds=Các thế giới đã bật tính năng chống X-ray tích hợp (đang thử nghiệm)
worldSettings.doNotTickWorlds=Worlds where random block ticking is disabled
worldSettings.entitySpawningDisabledWorlds=Worlds where entity auto spawning is not allowed
worldSettings.loadAllWorlds=Tải tất cả các thế giới khi khởi động
worldSettings.autoSaveDisabledWorlds=Các thế giới đã tắt tính năng tự động lưu
worldSettings.worlds=Per-world custom settings (only configure worlds that need a custom generator/seed)

# Người chơi
playerSettings.savePlayerData=Lưu dữ liệu người chơi vào đĩa
playerSettings.savePlayerDataByUuid=Lưu dữ liệu người chơi theo UUID thay vì tên
playerSettings.personaSkins=Cho phép sử dụng skin nhân vật (mô hình người chơi tùy chỉnh)
playerSettings.skinChangeCooldown=Thời gian hồi cho việc thay đổi skin (giây)
playerSettings.doNotLimitSkinGeometry=Không giới hạn kích thước hình học của skin
playerSettings.doNotLimitInteractions=Không giới hạn khoảng cách tương tác
playerSettings.spaceNameMode=Cách xử lý khoảng trắng trong tên người chơi (bỏ qua, thay thế, từ chối)
playerSettings.xpBottlesOnCreative=Cho phép sử dụng chai kinh nghiệm trong chế độ sáng tạo
playerSettings.stopInGame=Cho phép dừng server từ trong game
playerSettings.opInGame=Cho phép cấp OP cho người chơi từ trong game

# Gỡ lỗi
debugSettings.debugLevel=Mức độ debug (1=chỉ lỗi, 2=cảnh báo, 3=thông tin)
debugSettings.ansiTitle=Bật màu ANSI trong tiêu đề terminal
debugSettings.deprecatedVerbose=Hiển thị cảnh báo deprecated chi tiết
debugSettings.callDataPkSendEvent=Gọi DataPacketSendEvent
debugSettings.callBatchPkSendEvent=Gọi BatchPacketSendEvent
debugSettings.callEntityMotionEvent=Gọi EntityMotionEvent
debugSettings.blockListener=Bật block listener
debugSettings.automaticBugReport=Bật báo cáo lỗi tự động (Sentry)
debugSettings.updateNotifications=Hiển thị thông báo cập nhật
debugSettings.bstatsMetrics=Bật chỉ số bStats
debugSettings.hastebinToken=API token Hastebin để tải nội dung lên

# Tính năng trò chơi
gameFeatureSettings.achievements=Bật thành tựu
gameFeatureSettings.announcePlayerAchievements=Thông báo thành tích của người chơi trong khung chat
gameFeatureSettings.bedSpawnpoints=Cho phép giường thiết lập điểm hồi sinh
gameFeatureSettings.explosionBreakBlocks=Allow explosions to break blocks
gameFeatureSettings.dropSpawners=Cho phép spawner rơi ra khi bị phá
gameFeatureSettings.anvilsEnabled=Enable anvil usage
gameFeatureSettings.vanillaBossbars=Enable vanilla boss bars
gameFeatureSettings.useClientSpectator=Sử dụng chế độ khán giả phía client
gameFeatureSettings.enableExperimentMode=Enable experimental mode features
gameFeatureSettings.multiversionMinProtocol=Minimum protocol version to allow (0 = no limit)
gameFeatureSettings.multiversionMaxProtocol=Maximum protocol version to allow (-1 = no limit)
gameFeatureSettings.enableRawOres=Enable raw ore items
gameFeatureSettings.enableNewPaintings=Enable new painting variants
gameFeatureSettings.enableNewChickenEggsLaying=Enable new chicken egg laying mechanics
gameFeatureSettings.forcedSafetyEnchant=Force safety enchantment checks
gameFeatureSettings.enableVibrantVisuals=Enable vibrant visuals feature
gameFeatureSettings.enableRaytracing=Enable raytracing support
gameFeatureSettings.tempIpBanFailedXboxAuth=Temporarily ban players who fail Xbox authentication
gameFeatureSettings.strongIpBans=Enable stricter IP bans
gameFeatureSettings.checkOpMovement=Check operator movement for cheating
gameFeatureSettings.vanillaArmorReduction=Use vanilla armor damage reduction formula (with toughness/breach/deterministic EPF; disable for legacy linear formula)

# NetEase
neteaseSettings.clientSupport=Bật hỗ trợ NetEase client
neteaseSettings.onlyAllowNeteaseClient=Chỉ hỗ trợ NetEase clients

# Custom blocks
customBlockSettings=Custom block settings
customBlockSettings.autoDownloadVanillaPalette=Tự động tải vanilla block palette (vanilla_palette_*.nbt) từ mirror chính thức khi thiếu, lưu cache trong bin/ và xác minh bằng SHA256; nếu tắt, bạn phải tự đặt các file này vào bin/
customBlockSettings.useHashedBlockNetworkIds=Gửi ID mạng block dạng hash (blockNetworkIdsHashed) cho client 1.19.80+ (bao gồm client NetEase) thay vì runtime ID cũ; mặc định bật, không ảnh hưởng client <1.19.80 và luôn bật khi đăng ký custom block
