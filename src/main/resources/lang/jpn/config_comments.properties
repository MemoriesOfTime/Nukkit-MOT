# Nukkit-MOT config comments (nukkit-mot.yml + server.properties) - 日本語

# Category labels
performanceSettings=パフォーマンスとスレッド処理の設定
networkSettings=ネットワークと圧縮の設定
chunkSettings=チャンクの読み込みとティック処理の設定
entitySettings=エンティティのスポーンとAIの設定
worldSettings=ワールドとディメンションの設定
playerSettings=プレイヤーデータとインタラクションの設定
debugSettings=デバッグ、ログ、メトリクスの設定
gameFeatureSettings=ゲーム機能の有効化・無効化設定
neteaseSettings=NetEaseクライアントのサポート設定

# Performance
performanceSettings.asyncWorkers=非同期ワーカースレッド数（auto = CPUコア数 + 1）
performanceSettings.autoTickRate=サーバー負荷に基づいてティックレートを自動調整
performanceSettings.autoTickRateLimit=自動調整時の最大ティックレート
performanceSettings.baseTickRate=基本ティックレート（1 = 通常速度）
performanceSettings.alwaysTickPlayers=スポーン地点から遠く離れていても常にプレイヤーをティック処理する
performanceSettings.threadWatchdog=スレッドウォッチドッグを有効化
performanceSettings.threadWatchdogTick=スレッドウォッチドッグのチェック間隔（ms）
performanceSettings.doLevelGc=ワールドのガベージコレクションを有効化
performanceSettings.ticksPerAutosave=自動保存の間隔（6000 = 5分）
performanceSettings.levelAutoCompaction=ワールドの自動コンパクションを有効化
performanceSettings.levelAutoCompactionTicks=コンパクション実行間隔（36000 = 30分）
performanceSettings.leveldbCacheMb=LevelDBキャッシュサイズ（MB）
performanceSettings.useNativeLeveldb=ネイティブLevelDBライブラリを使用
performanceSettings.enableSpark=Sparkプロファイラーを有効化

# ネットワーク
networkSettings.zlibProvider=ZLIB圧縮プロバイダー（2を推奨）
networkSettings.compressionLevel=圧縮レベル（1～9、高いほどCPU使用量が増え、パケットサイズが小さくなる）
networkSettings.chunkCompressionLevel=チャンク圧縮レベル（1～9、高いほどCPU使用量が増え、チャンクサイズが小さくなる）
networkSettings.compressionThreshold=圧縮を適用するしきい値（バイト）
networkSettings.useSnappyCompression=ZLIBの代わりにSnappy圧縮を使用
networkSettings.rakPacketLimit=IPごとの10msあたりのRakNetパケット最大数
networkSettings.rakCookieMode=RakNet Cookieモード（active、offloaded、offloaded_psk、off、none、stateless）
networkSettings.timeoutMilliseconds=ログインタイムアウト（ミリ秒）。NetherNet の WebRTC ハンドシェイク段階にも適用（0 の場合は 30 秒にフォールバック）
networkSettings.queryPlugins=Query応答にプラグイン一覧を表示
networkSettings.useWaterdog=WaterDogプロキシモードを有効化
networkSettings.viaProxyUsernamePrefix=ViaProxy Java Editionプレイヤーのユーザー名プレフィックス
networkSettings.enableProxyProtocol=UDPプロキシ（例：FRP）向けのProxy Protocol v2を有効化。ホワイトリスト登録された送信元は有効なPPv2ヘッダーを送信する必要があり、ホワイトリスト外の送信元は直接接続されたクライアントとして扱われます
networkSettings.proxyProtocolWhitelist=Proxy Protocol用にホワイトリスト登録するプロキシ送信元のIPv4/IPv6 CIDRエントリ。プレイヤーのアドレスではなく、プロキシのアドレスを指定してください。IPv6のローカルアドレスはデフォルトで信頼されます。ホワイトリスト登録された送信元からのヘッダーなし、または無効なパケットは破棄されます

# NetherNet
networkSettings.netherNetSettings=NetherNet（WebRTC）転送設定。RakNetと並行して動作します。制限されたネットワーク環境の1.21.90以降のクライアントはHTTPシグナリング＋WebRTCで接続します
networkSettings.netherNetSettings.enabled=デフォルトでRakNetと並行して有効。無効化するにはfalseを設定。シグナリングはserver-portをTCPで共有し、WebRTCメディアはシステム割り当てのUDPポートを使用します（server.propertiesのserver-udp-portsで固定可能）
networkSettings.netherNetSettings.iceServers=追加のICE STUN/TURNサーバー（例：stun:stun.l.google.com:19302）。TURNの認証情報はURLに含めます：turn:user:pass@host:port?transport=udp
networkSettings.netherNetSettings.identityFile=運営者IDのPEMファイル。初回起動時に生成されるため保持してください。変更すると再接続した全プレイヤーに信頼確認のダイアログが再表示されます
networkSettings.netherNetSettings.identityDomain=クライアントの信頼ダイアログに表示される運営者名（空欄でMOTDを使用）

# チャンク
chunkSettings.sendingPerTick=1ティックあたりに送信するチャンク数
chunkSettings.tickingPerTick=1ティックあたりにティック処理するチャンク数
chunkSettings.tickingRadius=プレイヤー周辺のチャンクティック処理範囲
chunkSettings.generationQueueSize=チャンク生成キューのサイズ
chunkSettings.generationPopulationQueueSize=チャンク生成処理キューのサイズ
chunkSettings.lightUpdates=動的な光更新を有効化
chunkSettings.clearChunkTickList=保存時にチャンクティックリストをクリア
chunkSettings.spawnThreshold=チャンク読み込み時のスポーンしきい値
chunkSettings.cacheChunks=チャンクをメモリにキャッシュ
chunkSettings.asyncChunks=非同期チャンクの読み込み、送信、保存を使用
chunkSettings.maxPendingChunkWrites=アンロードが一時停止するまでのワールドごとの保留中チャンク書き込み最大数（バックプレッシャー）

# エンティティ
entitySettings.spawnEggs=スポーンエッグの使用を許可
entitySettings.mobAi=Mob AI（経路探索、ターゲット設定など）を有効化
entitySettings.autoSpawnTask=エンティティの自動スポーンタスクを有効化
entitySettings.despawnTask=エンティティの自動デスポーンタスクを有効化
entitySettings.ticksPerSpawns=エンティティのスポーン試行間隔（ティック）
entitySettings.ticksPerDespawns=エンティティのデスポーンチェック間隔（ティック）

# ワールド
worldSettings.nether=ネザー次元を有効化
worldSettings.end=エンド次元を有効化
worldSettings.vanillaPortals=バニラのポータル機能を有効化
worldSettings.portalTicks=テレポートするまでポータル内で待機するティック数
worldSettings.multiNetherWorlds=独自のネザー次元を使用するワールド。それ以外はデフォルトのネザーワールドを使用
worldSettings.antiXrayWorlds=実験的な組み込みアンチXrayを有効化するワールド
worldSettings.doNotTickWorlds=ランダムブロックティックを無効化するワールド
worldSettings.entitySpawningDisabledWorlds=エンティティの自動スポーンを許可しないワールド
worldSettings.loadAllWorlds=起動時にすべてのワールドを読み込む
worldSettings.autoSaveDisabledWorlds=ワールドの自動保存を無効化するワールド
worldSettings.worlds=ワールドごとのカスタム設定（カスタムジェネレーターまたはシードが必要なワールドのみ設定）

# ワールドごとのエントリフィールド (worlds 配下)
worldEntry.generator=ワールドジェネレーターのタイプ (normal、flat、nether、the_end、void)
worldEntry.seed=ワールドシード (0 = ランダム)
worldEntry.generatorSettings=ジェネレーター設定（例: フラットのレイヤー定義）

# プレイヤー
playerSettings.savePlayerData=プレイヤーデータをディスクに保存
playerSettings.savePlayerDataByUuid=名前ではなくUUIDでプレイヤーデータを保存
playerSettings.personaSkins=ペルソナスキン（カスタムプレイヤーモデル）を許可
playerSettings.skinChangeCooldown=スキン変更のクールダウン（秒）
playerSettings.doNotLimitSkinGeometry=スキンのジオメトリサイズを制限しない
playerSettings.doNotLimitInteractions=インタラクション距離を制限しない
playerSettings.spaceNameMode=ユーザー名に含まれるスペースの処理方法（ignore、replace、deny）
playerSettings.xpBottlesOnCreative=クリエイティブモードで経験値ボトルを許可
playerSettings.stopInGame=ゲーム内からサーバーの停止を許可
playerSettings.opInGame=ゲーム内からプレイヤーへのOP付与を許可

# デバッグ
debugSettings.debugLevel=デバッグレベル（1=エラーのみ、2=警告、3=情報）
debugSettings.ansiTitle=ターミナルタイトルでANSIカラーを有効化
debugSettings.deprecatedVerbose=詳細な非推奨警告を表示
debugSettings.callDataPkSendEvent=DataPacketSendEventを呼び出す
debugSettings.callBatchPkSendEvent=BatchPacketSendEventを呼び出す
debugSettings.callEntityMotionEvent=EntityMotionEventを呼び出す
debugSettings.blockListener=ブロックリスナーを有効化
debugSettings.automaticBugReport=自動バグ報告（Sentry）を有効化
debugSettings.updateNotifications=アップデート通知を表示
debugSettings.bstatsMetrics=bStatsメトリクスを有効化
debugSettings.hastebinToken=ペーストアップロード用のHastebin APIトークン

# ゲーム機能
gameFeatureSettings.achievements=実績を有効化
gameFeatureSettings.announcePlayerAchievements=プレイヤーの実績をチャットで通知
gameFeatureSettings.bedSpawnpoints=ベッドによるスポーン地点の設定を許可
gameFeatureSettings.explosionBreakBlocks=爆発によるブロックの破壊を許可
gameFeatureSettings.dropSpawners=破壊時にスポナーをドロップさせる
gameFeatureSettings.anvilsEnabled=金床の使用を有効化
gameFeatureSettings.vanillaBossbars=バニラのボスバーを有効化
gameFeatureSettings.useClientSpectator=クライアント側のスペクテイターモードを使用
gameFeatureSettings.enableExperimentMode=実験的機能を有効化
gameFeatureSettings.multiversionMinProtocol=許可する最小プロトコルバージョン（0 = 制限なし）
gameFeatureSettings.multiversionMaxProtocol=許可する最大プロトコルバージョン（-1 = 制限なし）
gameFeatureSettings.enableRawOres=原石アイテムを有効化
gameFeatureSettings.enableNewPaintings=新しい絵画バリエーションを有効化
gameFeatureSettings.enableNewChickenEggsLaying=新しいニワトリの産卵メカニズムを有効化
gameFeatureSettings.forcedSafetyEnchant=安全エンチャントのチェックを強制
gameFeatureSettings.enableVibrantVisuals=Vibrant Visuals機能を有効化
gameFeatureSettings.enableRaytracing=レイトレーシングのサポートを有効化
gameFeatureSettings.tempIpBanFailedXboxAuth=Xbox認証に失敗したプレイヤーを一時的にIP BAN
gameFeatureSettings.strongIpBans=より厳格なIP BANを有効化
gameFeatureSettings.checkOpMovement=不正行為検出のためOPの移動をチェック
gameFeatureSettings.vanillaArmorReduction=バニラの防具ダメージ軽減計算式を使用（Toughness、Breach、決定論的EPFを含む。無効にすると従来の線形計算式を使用）
gameFeatureSettings.vanillaKnockbackResistance=バニラの防具ノックバック耐性を適用（ネザライト防具1部位につき10%のノックバックを軽減。無効にすると従来のフル強度のノックバックを使用）

# NetEase
neteaseSettings.clientSupport=NetEaseクライアントのサポートを有効化
neteaseSettings.onlyAllowNeteaseClient=NetEaseクライアントのみを許可

# Custom blocks
customBlockSettings=カスタムブロックの設定
customBlockSettings.autoDownloadVanillaPalette=不足している場合、公式ミラーからバニラブロックパレット（vanilla_palette_*.nbt）を自動的にダウンロードします。複数のクライアントプロトコルバージョンでカスタムブロックをサポートするために必要です。ファイルはbin/フォルダにキャッシュされ、SHA256で検証されます。無効にした場合は、bin/フォルダにファイルを手動で用意する必要があります
customBlockSettings.useHashedBlockNetworkIds=従来のランタイムIDの代わりに、ハッシュ化されたブロックネットワークID（blockNetworkIdsHashed）を1.19.80以降のクライアント（NetEaseクライアントを含む）に送信します。カスタムブロックがなくてもデフォルトで有効です。ハッシュ化されたIDはバージョン間で永続的です。プロトコル1.19.80未満には影響しません。カスタムブロックが登録されている場合は常に強制的に有効になります

# server.properties comments
properties.__unrecognized__=以下の設定項目は Nukkit-MOT では使用されません\nプラグインが必要とする場合のみ保持し、不要であれば削除できます
properties.motd=サーバーリストに表示されるサーバー名
properties.sub-motd=サブMOTD（一部のクライアントのサーバーリストに表示）
properties.server-port=サーバーがリッスンするUDPポート（デフォルト 19132）
properties.server-ip=バインドするIPv4アドレス（0.0.0.0 = 全インターフェース）
properties.server-ipv6-port=IPv6 UDPポート（-1 = 無効）
properties.server-ipv6=バインドするIPv6アドレス（:: = 全インターフェース）
properties.view-distance=プレイヤーごとの視野距離（チャンク）
properties.max-players=最大プレイヤー数
properties.language=サーバー言語（eng, chs, deu, jpn, rus, vie）
properties.force-language=すべてのクライアントにサーバー言語を強制
properties.shutdown-message=サーバー停止時にプレイヤーに表示するメッセージ
properties.gamemode=デフォルトのゲームモード（0=サバイバル, 1=クリエイティブ, 2=アドベンチャー, 3=スペクテイター）
properties.force-gamemode=参加時にゲームモードをデフォルトに戻す
properties.difficulty=ワールド難易度（0=ピースフル, 1=イージー, 2=ノーマル, 3=ハード）
properties.hardcore=ハードコアモードを有効化
properties.pvp=プレイヤー間戦闘（PvP）を許可
properties.level-name=デフォルトのワールド名
properties.level-seed=デフォルトのワールドシード（空欄 = ランダム）
properties.level-type=ワールド生成タイプ（default, flat, nether, the_end, void）
properties.generator-settings=生成器の設定（例: フラットレイヤー定義）
properties.spawn-protection=スポーン保護半径（ブロック）（0 = 無効）
properties.white-list=ホワイトリストを有効化
properties.whitelist-reason=ホワイトリスト外のプレイヤーへのキックメッセージ
properties.xbox-auth=Xbox Live認証を必須にする
properties.encryption=ネットワーク暗号化を有効化
properties.force-resources=クライアントにサーバーリソースパックの受け入れを強制
properties.force-resources-allow-client-packs=サーバーパック強制時にクライアントのリソースパックを許可
properties.spawn-animals=動物をスポーンさせる
properties.spawn-mobs=敵対モブをスポーンさせる
properties.allow-flight=飛行を許可（無効の場合は飛行中のプレイヤーをキック）
properties.auto-save=ワールド自動保存を有効化
properties.enable-rcon=RCONリモートコンソールを有効化
properties.rcon.password=RCONパスワード
properties.rcon.port=RCONポート
properties.enable-query=GameSpy4クエリプロトコルを有効化
properties.server-authoritative-movement=移動検証方式（client-auth, server-auth, server-auth-with-rewind）
properties.server-authoritative-block-breaking=ブロック破壊の進捗をサーバーが検証
properties.server-authoritative-inventory=インベントリ操作をサーバーが検証
