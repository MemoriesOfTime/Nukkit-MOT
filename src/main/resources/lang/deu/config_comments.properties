# Nukkit-MOT Konfigurationskommentare (nukkit-mot.yml + server.properties) - Deutsch

# Kategoriebezeichnungen
performanceSettings=Leistungs- und Threading-Einstellungen
networkSettings=Netzwerk- und Komprimierungseinstellungen
chunkSettings=Chunk-Lade- und Tick-Einstellungen
entitySettings=Entity-Spawning- und KI-Einstellungen
worldSettings=Welt- und Dimensionseinstellungen
playerSettings=Spielerdaten- und Interaktionseinstellungen
debugSettings=Debug-, Protokoll- und Metrikeinstellungen
gameFeatureSettings=Spielfunktionsschalter
neteaseSettings=NetEase-Client-Unterstuetzungseinstellungen

# Leistung
performanceSettings.asyncWorkers=Anzahl der asynchronen Worker-Threads (auto = CPU-Kerne + 1)
performanceSettings.autoTickRate=Tick-Rate automatisch an Serverlast anpassen
performanceSettings.autoTickRateLimit=Maximale Tick-Rate bei automatischer Anpassung
performanceSettings.baseTickRate=Basis-Tick-Rate (1 = normale Geschwindigkeit)
performanceSettings.alwaysTickPlayers=Spieler immer ticken, auch weit vom Spawn entfernt
performanceSettings.threadWatchdog=Thread-Watchdog aktivieren
performanceSettings.threadWatchdogTick=Thread-Watchdog-Pruefintervall (ms)
performanceSettings.doLevelGc=Level-Garbage-Collection aktivieren
performanceSettings.ticksPerAutosave=Ticks zwischen automatischen Speicherungen (6000 = 5 Minuten)
performanceSettings.levelAutoCompaction=Automatische Level-Komprimierung aktivieren
performanceSettings.levelAutoCompactionTicks=Ticks zwischen Komprimierungslaeufen (36000 = 30 Minuten)
performanceSettings.leveldbCacheMb=LevelDB-Cache-Groesse in MB
performanceSettings.useNativeLeveldb=Native LevelDB-Bibliothek verwenden
performanceSettings.enableSpark=Spark-Profiler aktivieren

# Netzwerk
networkSettings.zlibProvider=ZLIB-Komprimierungsanbieter (2 empfohlen)
networkSettings.compressionLevel=Komprimierungsstufe (1-9, hoeher = mehr CPU, kleinere Pakete)
networkSettings.chunkCompressionLevel=Chunk-Komprimierungsstufe (1-9, hoeher = mehr CPU, kleinere Chunks)
networkSettings.compressionThreshold=Komprimierungsschwelle in Bytes
networkSettings.useSnappyCompression=Snappy-Komprimierung anstelle von ZLIB verwenden
networkSettings.useNeteaseZlibStreamCompression=Zlibstream-Komprimierung für NetEase-Clients verwenden
networkSettings.rakPacketLimit=Max. RakNet-Pakete pro 10 ms pro IP
networkSettings.rakCookieMode=RakNet-Cookie-Modus (active, offloaded, offloaded_psk, off, none, stateless)
networkSettings.timeoutMilliseconds=Login-Timeout in Millisekunden, begrenzt auch die NetherNet-WebRTC-Handshake-Phase (bei 0: 30s Fallback)
networkSettings.queryPlugins=Plugin-Liste in Query-Antwort anzeigen
networkSettings.useWaterdog=WaterDog-Proxy-Modus aktivieren
networkSettings.viaProxyUsernamePrefix=ViaProxy Java Edition Spieler-Benutzernamen-Praefix
networkSettings.enableProxyProtocol=Proxy Protocol v2 fuer UDP-Proxys aktivieren (z.B. FRP). Quellen aus der Whitelist muessen einen gueltigen PPv2-Header senden; nicht gelistete Quellen werden als direkte Clients behandelt
networkSettings.proxyProtocolWhitelist=Whitelist fuer Proxy-Quell-IPv4/IPv6-CIDR-Eintraege bei Proxy Protocol. Hier muessen Proxy-Adressen und keine Spieler-Adressen eingetragen werden; lokale IPv6-Adressen werden standardmaessig vertraut; kopflose oder ungueltige Pakete aus der Whitelist werden verworfen

# NetherNet
networkSettings.netherNetSettings=NetherNet-Transporteinstellungen (WebRTC), laeuft parallel zu RakNet. Clients 1.21.90+ aus eingeschraenkten Netzen verbinden sich per HTTP-Signaling + WebRTC
networkSettings.netherNetSettings.enabled=Standardmaessig parallel zu RakNet aktiviert, kann deaktiviert werden. Signaling teilt sich den server-port per TCP; WebRTC-Medien fixieren UDP 19134 (ICE mux, ein Port fuer alle Peers) per server-udp-ports in server.properties, 0 = systemseitig zugewiesen
networkSettings.netherNetSettings.iceServers=Zusaetzliche ICE STUN/TURN-Server, z.B. stun:stun.l.google.com:19302. TURN-Zugangsdaten gehoeren in die URL: turn:user:pass@host:port?transport=udp
networkSettings.netherNetSettings.identityFile=Betreiber-Identity-PEM-Datei, wird beim ersten Start erzeugt, bitte behalten. Eine Aenderung laesst alle zurueckkehrenden Spieler die Vertrauensbestaetigung erneut bestaetigen
networkSettings.netherNetSettings.identityDomain=Betreibername im Vertrauensdialog des Clients, leer verwendet die MOTD

# Chunk
chunkSettings.sendingPerTick=Chunks, die pro Tick gesendet werden
chunkSettings.tickingPerTick=Chunks, die pro Tick verarbeitet werden
chunkSettings.tickingRadius=Chunk-Tick-Radius um Spieler
chunkSettings.generationQueueSize=Chunk-Generierungswarteschlangengroesse
chunkSettings.generationPopulationQueueSize=Chunk-Populationswarteschlangengroesse
chunkSettings.lightUpdates=Dynamische Lichtaktualisierungen aktivieren
chunkSettings.clearChunkTickList=Chunk-Tick-Liste beim Speichern leeren
chunkSettings.spawnThreshold=Spawn-Schwelle fuer Chunk-Laden
chunkSettings.cacheChunks=Chunks im Speicher zwischenspeichern
chunkSettings.asyncChunks=Asynchrones Chunk-Laden, -Senden und -Speichern verwenden
chunkSettings.maxPendingChunkWrites=Maximale ausstehende Chunk-Schreibvorgänge pro Welt, bevor das Entladen pausiert (Gegendruck)

# Entity
entitySettings.spawnEggs=Spawn-Eier erlauben
entitySettings.mobAi=Mob-KI aktivieren (Pfadfindung, Zielauswahl usw.)
entitySettings.autoSpawnTask=Automatische Entity-Spawn-Aufgabe aktivieren
entitySettings.despawnTask=Automatische Entity-Despawn-Aufgabe aktivieren
entitySettings.ticksPerSpawns=Ticks zwischen Entity-Spawn-Versuchen
entitySettings.ticksPerDespawns=Ticks zwischen Entity-Despawn-Pruefungen

# Welt
worldSettings.nether=Nether-Dimension aktivieren
worldSettings.end=End-Dimension aktivieren
worldSettings.vanillaPortals=Vanilla-Portal-Mechanik aktivieren
worldSettings.portalTicks=Ticks Wartezeit im Portal vor der Teleportation
worldSettings.multiNetherWorlds=Welten, die ihre eigene Nether-Dimension haben sollen, ansonsten wird die Standard-Nether-Welt verwendet
worldSettings.antiXrayWorlds=Welten, in denen das experimentelle eingebaute Anti-Xray aktiviert ist
worldSettings.doNotTickWorlds=Welten, in denen das zufaellige Block-Ticking deaktiviert ist
worldSettings.entitySpawningDisabledWorlds=Welten, in denen das automatische Spawnen von Entities nicht erlaubt ist
worldSettings.loadAllWorlds=Alle Welten beim Start laden
worldSettings.autoSaveDisabledWorlds=Welten, in denen das automatische Speichern deaktiviert ist
worldSettings.worlds=Individuelle Welt-Einstellungen (nur Welten konfigurieren, die einen besonderen Generator/Seed benoetigen)

# Felder der einzelnen Welt-Eintraege (unter worlds)
worldEntry.generator=Weltgenerator-Typ (normal, flat, nether, the_end, void)
worldEntry.seed=Welt-Seed (0 = zufaellig)
worldEntry.generatorSettings=Generator-Einstellungen (z.B. Flat-Layer-Definition)

# Spieler
playerSettings.savePlayerData=Spielerdaten auf Festplatte speichern
playerSettings.savePlayerDataByUuid=Spielerdaten nach UUID statt Name speichern
playerSettings.personaSkins=Persona-Skins erlauben (benutzerdefinierte Spielermodelle)
playerSettings.skinChangeCooldown=Abklingzeit fuer Skin-Wechsel (Sekunden)
playerSettings.doNotLimitSkinGeometry=Skin-Geometriegroesse nicht begrenzen
playerSettings.doNotLimitInteractions=Interaktionsdistanz nicht begrenzen
playerSettings.spaceNameMode=Umgang mit Leerzeichen in Benutzernamen (ignore, replace, deny)
playerSettings.xpBottlesOnCreative=XP-Flaschen im Kreativmodus erlauben
playerSettings.stopInGame=Server-Stopp im Spiel erlauben
playerSettings.opInGame=OP-Vergabe im Spiel erlauben

# Debug
debugSettings.debugLevel=Debug-Stufe (1=nur Fehler, 2=Warnungen, 3=Info)
debugSettings.ansiTitle=ANSI-Farben im Terminal-Titel aktivieren
debugSettings.deprecatedVerbose=Ausfuehrliche Veralterungswarnungen anzeigen
debugSettings.callDataPkSendEvent=DataPacketSendEvent aufrufen
debugSettings.callBatchPkSendEvent=BatchPacketSendEvent aufrufen
debugSettings.callEntityMotionEvent=EntityMotionEvent aufrufen
debugSettings.blockListener=Block-Listener aktivieren
debugSettings.automaticBugReport=Automatische Fehlerberichte aktivieren (Sentry)
debugSettings.updateNotifications=Update-Benachrichtigungen anzeigen
debugSettings.bstatsMetrics=bStats-Metriken aktivieren
debugSettings.hastebinToken=Hastebin-API-Token fuer Paste-Uploads

# Spielfunktionen
gameFeatureSettings.achievements=Erfolge aktivieren
gameFeatureSettings.announcePlayerAchievements=Spielererfolge im Chat ankuendigen
gameFeatureSettings.bedSpawnpoints=Betten als Spawnpunkte erlauben
gameFeatureSettings.explosionBreakBlocks=Explosionen duerfen Bloecke zerstoeren
gameFeatureSettings.dropSpawners=Spawner droppen beim Abbauen
gameFeatureSettings.anvilsEnabled=Amboss-Nutzung aktivieren
gameFeatureSettings.vanillaBossbars=Vanilla-Boss-Balken aktivieren
gameFeatureSettings.useClientSpectator=Client-seitigen Zuschauermodus verwenden
gameFeatureSettings.enableExperimentMode=Experimentelle Funktionen aktivieren
gameFeatureSettings.multiversionMinProtocol=Minimale erlaubte Protokollversion (0 = kein Limit)
gameFeatureSettings.multiversionMaxProtocol=Maximale erlaubte Protokollversion (-1 = kein Limit)
gameFeatureSettings.enableRawOres=Roherz-Items aktivieren
gameFeatureSettings.enableNewPaintings=Neue Gemaeldevarianten aktivieren
gameFeatureSettings.enableNewChickenEggsLaying=Neue Huehner-Eierleg-Mechanik aktivieren
gameFeatureSettings.forcedSafetyEnchant=Sicherheitsverzauberungspruefungen erzwingen
gameFeatureSettings.enableVibrantVisuals=Lebhafte visuelle Effekte aktivieren
gameFeatureSettings.enableRaytracing=Raytracing-Unterstuetzung aktivieren
gameFeatureSettings.tempIpBanFailedXboxAuth=Spieler bei fehlgeschlagener Xbox-Authentifizierung temporaer bannen
gameFeatureSettings.strongIpBans=Strengere IP-Bans aktivieren
gameFeatureSettings.checkOpMovement=OP-Spielerbewegungen auf Cheating pruefen
gameFeatureSettings.vanillaArmorReduction=Vanilla-Ruestungsschadensformel verwenden (mit Zaehigkeit/Durchbruch/deterministischem EPF; deaktivieren fuer alte lineare Formel)
gameFeatureSettings.vanillaKnockbackResistance=Vanilla-Knockbackwiderstand der Ruestung anwenden (jedes Netherit-Teil widersteht 10% des Rueckschlags; deaktivieren fuer alten vollen Rueckschlag)

# NetEase
neteaseSettings.clientSupport=NetEase-Client-Unterstuetzung aktivieren
neteaseSettings.onlyAllowNeteaseClient=Nur NetEase-Clients erlauben

# Benutzerdefinierte Bloecke
customBlockSettings=Einstellungen fuer benutzerdefinierte Bloecke
customBlockSettings.autoDownloadVanillaPalette=Fehlende Vanilla-Blockpaletten (vanilla_palette_*.nbt) automatisch vom offiziellen Mirror herunterladen. Erforderlich fuer die Unterstuetzung benutzerdefinierter Bloecke ueber mehrere Client-Protokollversionen. Dateien werden im Ordner bin/ zwischengespeichert und mit SHA256 verifiziert. Wenn deaktiviert, muessen die Dateien manuell im Ordner bin/ bereitgestellt werden
customBlockSettings.useHashedBlockNetworkIds=Gehashte Block-Netzwerk-IDs (blockNetworkIdsHashed) an 1.19.80+-Clients senden, einschliesslich NetEase-Clients, anstelle von Legacy-Laufzeit-IDs. Standardmaessig aktiviert, auch ohne benutzerdefinierte Bloecke; gehashte IDs sind versionenuebergreifend stabil. Keine Auswirkung auf Protokoll < 1.19.80. Wird immer erzwungen, wenn benutzerdefinierte Bloecke registriert werden

# server.properties comments
properties.__unrecognized__=Die folgenden Einstellungen werden von Nukkit-MOT nicht verwendet\nNur behalten, wenn ein Plugin sie benoetigt, sonst koennen sie geloescht werden
properties.motd=Servername, der in der Serverliste angezeigt wird
properties.sub-motd=Sekundaere MOTD-Zeile (in einigen Client-Serverlisten sichtbar)
properties.server-port=Serverport: RakNet-UDP-Listener, bei aktivem NetherNet zusaetzlich TCP fuer die WebRTC-Signalisierung (Standard 19132)
properties.server-ip=Zu bindende IPv4-Adresse fuer RakNet-UDP und NetherNet-TCP-Signalisierung (0.0.0.0 = alle Schnittstellen)
properties.server-udp-ports=UDP-Ports fuer NetherNet-WebRTC-Medien (BDS-Syntax): Standard 19134 (ein ICE-mux-Port fuer alle Peers), 0 = systemseitig zugewiesen, N oder A-B legt ein Portfenster fest, [ip:]ext:int veroeffentlicht eine externe Zuordnung. Darf server-port (RakNet) und den IPv6-Listener nicht abdecken; ungueltige Werte brechen den Start ab
properties.server-ipv6-port=IPv6-UDP-Port fuer RakNet (-1 = deaktiviert)
properties.server-ipv6=Zu bindende IPv6-Adresse fuer RakNet (:: = alle Schnittstellen)
properties.view-distance=Sichtweite in Chunks pro Spieler
properties.max-players=Maximale Anzahl an Spielern
properties.language=Serversprache (eng, chs, deu, jpn, rus, vie)
properties.force-language=Serversprache fuer alle Clients erzwingen
properties.shutdown-message=Nachricht an Spieler beim Herunterfahren des Servers
properties.gamemode=Standard-Spielmodus (0=Ueberleben, 1=Kreativ, 2=Abenteuer, 3=Zuschauer)
properties.force-gamemode=Spielmodus beim Beitreten auf den Standard zuruecksetzen
properties.difficulty=Welt-Schwierigkeit (0=Friedlich, 1=Einfach, 2=Normal, 3=Schwer)
properties.hardcore=Hardcore-Modus aktivieren
properties.pvp=Spielerkampf (PvP) erlauben
properties.level-name=Name der Standardwelt
properties.level-seed=Seed der Standardwelt (leer = zufaellig)
properties.level-type=Weltgenerator-Typ (default, flat, nether, the_end, void)
properties.generator-settings=Generator-Einstellungen (z. B. Flat-Layer-Definition)
properties.spawn-protection=Spawn-Schutzradius in Bloecken (0 = deaktiviert)
properties.white-list=Whitelist aktivieren
properties.whitelist-reason=Kick-Nachricht fuer Spieler ausserhalb der Whitelist
properties.xbox-auth=Xbox-Live-Authentifizierung erforderlich
properties.encryption=Netzwerkverschluesselung fuer RakNet-Sitzungen aktivieren (NetherNet ist immer per DTLS gesichert)
properties.force-resources=Clients zur Annahme des Server-Ressourcenpakets zwingen
properties.force-resources-allow-client-packs=Client-Ressourcenpakete trotz erzwungenem Serverpaket erlauben
properties.spawn-animals=Tiere spawnen
properties.spawn-mobs=Feindliche Mobs spawnen
properties.allow-flight=Fliegen erlauben (bei Deaktivierung werden fliegende Spieler gekickt)
properties.auto-save=Welt-Autospeichern aktivieren
properties.enable-rcon=RCON-Fernkonsole aktivieren
properties.rcon.password=RCON-Passwort
properties.rcon.port=RCON-Port
properties.enable-query=GameSpy4-Query-Protokoll aktivieren
properties.server-authoritative-movement=Bewegungsautoritaet (client-auth, server-auth, server-auth-with-rewind)
properties.server-authoritative-block-breaking=Blockabbau-Fortschritt wird vom Server validiert
properties.server-authoritative-inventory=Inventartransaktionen werden vom Server validiert
