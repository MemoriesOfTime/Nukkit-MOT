# Nukkit-MOT 配置注释（nukkit-mot.yml + server.properties）- 简体中文

# 分类标签
performanceSettings=性能与线程设置
networkSettings=网络与压缩设置
chunkSettings=区块加载与刻运算设置
entitySettings=实体生成与AI设置
worldSettings=世界与维度设置
playerSettings=玩家数据与交互设置
debugSettings=调试、日志与统计设置
gameFeatureSettings=游戏功能开关
neteaseSettings=网易客户端支持设置

# 性能设置
performanceSettings.asyncWorkers=异步工作线程数 (auto = CPU核心数 + 1)
performanceSettings.autoTickRate=根据服务器负载自动调整tick速率
performanceSettings.autoTickRateLimit=自动调整时的最大tick速率
performanceSettings.baseTickRate=基础tick速率 (1 = 正常速度)
performanceSettings.alwaysTickPlayers=即使远离出生点也始终处理玩家tick
performanceSettings.threadWatchdog=启用线程看门狗
performanceSettings.threadWatchdogTick=线程看门狗检查间隔 (毫秒)
performanceSettings.doLevelGc=启用世界垃圾回收
performanceSettings.ticksPerAutosave=自动保存间隔tick数 (6000 = 5分钟)
performanceSettings.levelAutoCompaction=启用自动世界压缩
performanceSettings.levelAutoCompactionTicks=世界压缩运行间隔tick数 (36000 = 30分钟)
performanceSettings.leveldbCacheMb=LevelDB缓存大小 (MB)
performanceSettings.useNativeLeveldb=使用原生LevelDB库
performanceSettings.enableSpark=启用Spark性能分析器

# 网络设置
networkSettings.zlibProvider=ZLIB压缩提供者 (推荐值: 2)
networkSettings.compressionLevel=压缩等级 (1-9, 越高=越耗CPU, 数据包越小)
networkSettings.chunkCompressionLevel=区块压缩等级 (1-9, 越高=越耗CPU, 区块数据越小)
networkSettings.compressionThreshold=压缩阈值 (字节)
networkSettings.useSnappyCompression=使用Snappy压缩代替ZLIB
networkSettings.useNeteaseZlibStreamCompression=为网易客户端使用zlibstream压缩
networkSettings.rakPacketLimit=每个IP每10ms的RakNet数据包上限
networkSettings.rakCookieMode=RakNet Cookie模式 (active, offloaded, offloaded_psk, off, none, stateless)
networkSettings.timeoutMilliseconds=登录超时时间 (毫秒)，同时约束 NetherNet WebRTC 握手阶段 (0 时回落 30 秒)
networkSettings.queryPlugins=在查询响应中显示插件列表
networkSettings.useWaterdog=启用WaterDog代理模式
networkSettings.viaProxyUsernamePrefix=ViaProxy Java版玩家用户名前缀
networkSettings.enableProxyProtocol=为UDP代理(如 FRP)启用 Proxy Protocol v2。白名单内来源必须发送合法的 PPv2 头；白名单外来源按直连客户端处理
networkSettings.proxyProtocolWhitelist=Proxy Protocol 可信代理源 IPv4/IPv6 CIDR 白名单。这里填写代理地址而不是玩家地址；IPv6 本地地址默认可信；白名单内来源的无头或非法报文会被丢弃

# NetherNet
networkSettings.netherNetSettings=NetherNet (WebRTC) 传输设置，与 RakNet 并行运行；受限网络下的 1.21.90+ 客户端经 HTTP 信令 + WebRTC 接入
networkSettings.netherNetSettings.enabled=默认与 RakNet 并行启用，可关闭。信令 TCP 与 server-port 同号；WebRTC 媒体 UDP 默认钉在 19134（ICE mux，单端口服务所有对端），由 server.properties 的 server-udp-ports 配置，0 仍为系统自动分配
networkSettings.netherNetSettings.iceServers=额外的 ICE STUN/TURN 服务器，如 stun:stun.l.google.com:19302。TURN 凭据写入 URL：turn:user:pass@host:port?transport=udp
networkSettings.netherNetSettings.identityFile=运营者身份 PEM 文件，首次启动生成，请保留；更换会使所有回归玩家重新弹出信任提示
networkSettings.netherNetSettings.identityDomain=客户端信任提示中的运营者名称，留空使用 MOTD

# 区块设置
chunkSettings.sendingPerTick=每tick发送的区块数
chunkSettings.tickingPerTick=每tick处理的区块数
chunkSettings.tickingRadius=玩家周围的区块刻运算半径
chunkSettings.generationQueueSize=区块生成队列大小
chunkSettings.generationPopulationQueueSize=区块填充队列大小
chunkSettings.lightUpdates=启用动态光照更新
chunkSettings.clearChunkTickList=保存时清空区块tick列表
chunkSettings.spawnThreshold=区块加载的生成阈值
chunkSettings.cacheChunks=在内存中缓存区块
chunkSettings.asyncChunks=使用异步区块加载、发送与保存
chunkSettings.maxPendingChunkWrites=每世界挂起区块写上限，超限暂停卸载（背压）

# 实体设置
entitySettings.spawnEggs=允许使用刷怪蛋
entitySettings.mobAi=启用生物AI (寻路、目标选择等)
entitySettings.autoSpawnTask=启用自动实体生成任务
entitySettings.despawnTask=启用自动实体消失任务
entitySettings.ticksPerSpawns=实体生成尝试间隔tick数
entitySettings.ticksPerDespawns=实体消失检查间隔tick数

# 世界设置
worldSettings.nether=启用下界维度
worldSettings.end=启用末地维度
worldSettings.vanillaPortals=启用原版传送门机制
worldSettings.portalTicks=传送门等待时间 (tick)
worldSettings.multiNetherWorlds=需要拥有独立地狱维度的世界，未列出的世界将使用默认地狱世界
worldSettings.antiXrayWorlds=启用内置反矿透的世界列表
worldSettings.doNotTickWorlds=禁用随机方块刻的世界列表
worldSettings.entitySpawningDisabledWorlds=不允许实体自动生成的世界列表
worldSettings.loadAllWorlds=启动时加载所有世界
worldSettings.autoSaveDisabledWorlds=禁用自动保存的世界列表
worldSettings.worlds=自定义世界配置 (仅需要自定义生成器/种子的世界才需要配置)

# 单个世界条目字段 (worlds 下)
worldEntry.generator=世界生成器类型 (normal、flat、nether、the_end、void)
worldEntry.seed=世界种子 (0 = 随机)
worldEntry.generatorSettings=生成器设置 (例如超平坦层定义)

# 玩家设置
playerSettings.savePlayerData=保存玩家数据到磁盘
playerSettings.savePlayerDataByUuid=按UUID保存玩家数据
playerSettings.personaSkins=允许Persona皮肤 (自定义玩家模型)
playerSettings.skinChangeCooldown=皮肤更换冷却时间 (秒)
playerSettings.doNotLimitSkinGeometry=不限制皮肤几何体大小
playerSettings.doNotLimitInteractions=不限制交互距离
playerSettings.spaceNameMode=用户名中空格的处理方式 (ignore=忽略, replace=替换, deny=拒绝)
playerSettings.xpBottlesOnCreative=允许在创造模式中使用经验瓶
playerSettings.stopInGame=允许游戏内关闭服务器
playerSettings.opInGame=允许游戏内给予OP权限

# 调试设置
debugSettings.debugLevel=调试等级 (1=仅错误, 2=警告, 3=信息)
debugSettings.ansiTitle=启用终端标题ANSI颜色
debugSettings.deprecatedVerbose=显示详细的弃用警告
debugSettings.callDataPkSendEvent=触发DataPacketSendEvent事件
debugSettings.callBatchPkSendEvent=触发BatchPacketSendEvent事件
debugSettings.callEntityMotionEvent=触发EntityMotionEvent事件
debugSettings.blockListener=启用方块监听器
debugSettings.automaticBugReport=启用自动错误报告 (Sentry)
debugSettings.updateNotifications=显示更新通知
debugSettings.bstatsMetrics=启用bStats统计
debugSettings.hastebinToken=Hastebin API令牌

# 游戏功能设置
gameFeatureSettings.achievements=启用成就
gameFeatureSettings.announcePlayerAchievements=在聊天中显示玩家获得成就消息
gameFeatureSettings.bedSpawnpoints=允许床设置重生点
gameFeatureSettings.explosionBreakBlocks=允许爆炸破坏方块
gameFeatureSettings.dropSpawners=允许刷怪笼被破坏时掉落
gameFeatureSettings.anvilsEnabled=启用铁砧
gameFeatureSettings.vanillaBossbars=启用原版Boss血条
gameFeatureSettings.useClientSpectator=启用客户端旁观模式
gameFeatureSettings.enableExperimentMode=启用实验性功能
gameFeatureSettings.multiversionMinProtocol=允许的最低协议版本 (0 = 无限制)
gameFeatureSettings.multiversionMaxProtocol=允许的最高协议版本 (-1 = 无限制)
gameFeatureSettings.enableRawOres=启用粗金属矿物（掉落物）
gameFeatureSettings.enableNewPaintings=启用新画作
gameFeatureSettings.enableNewChickenEggsLaying=启用新鸡蛋变种
gameFeatureSettings.forcedSafetyEnchant=强制安全附魔检查
gameFeatureSettings.enableVibrantVisuals=启用灵动视效
gameFeatureSettings.enableRaytracing=启用光线追踪
gameFeatureSettings.tempIpBanFailedXboxAuth=临时封禁Xbox认证失败的玩家
gameFeatureSettings.strongIpBans=启用更严格的IP封禁
gameFeatureSettings.checkOpMovement=检查OP玩家的移动是否作弊
gameFeatureSettings.vanillaArmorReduction=使用原版盔甲伤害减免公式（含韧性/破甲/确定性EPF，关闭则用旧线性公式）
gameFeatureSettings.vanillaKnockbackResistance=应用原版盔甲击退抗性（每件下界合金盔甲抵挡10%击退，关闭则恢复完整击退力度）

# 网易设置
neteaseSettings.clientSupport=启用网易客户端支持
neteaseSettings.onlyAllowNeteaseClient=仅允许网易客户端

# 自定义方块设置
customBlockSettings=自定义方块设置
customBlockSettings.autoDownloadVanillaPalette=缺失时自动从官方镜像下载原版方块调色板 (vanilla_palette_*.nbt)。跨多个客户端协议版本支持自定义方块时必需。文件会缓存在 bin/ 目录下并用 SHA256 校验。若禁用，需手动将文件准备到 bin/ 目录中
customBlockSettings.useHashedBlockNetworkIds=向 1.19.80+ 客户端（含网易客户端）发送哈希方块网络ID（blockNetworkIdsHashed）而非旧版运行时ID。默认开启，即使未注册自定义方块；哈希ID跨版本稳定。对 < 1.19.80 的协议无影响。注册自定义方块时会被强制开启

# server.properties 注释
properties.__unrecognized__=以下配置项不被 Nukkit-MOT 使用\n仅当插件需要时保留，否则可自行删除
properties.motd=服务器名称（显示在服务器列表中）
properties.sub-motd=副标题MOTD（显示在部分客户端的服务器列表中）
properties.server-port=服务器端口：RakNet UDP 监听，启用 NetherNet 时同号 TCP 承载 WebRTC 信令（默认 19132）
properties.server-ip=RakNet UDP 与 NetherNet TCP 信令绑定的IPv4地址（0.0.0.0 = 所有网卡）
properties.server-udp-ports=NetherNet WebRTC 媒体UDP端口（BDS 语法）：默认 19134（ICE mux 单端口服务所有对端），0 = 系统自动分配，N 或 A-B 钉住端口窗口，[ip:]ext:int 发布外部端口映射。不得覆盖 server-port（RakNet）或 IPv6 监听端口；无效值将中止启动
properties.server-ipv6-port=RakNet 的IPv6 UDP端口（-1 = 禁用）
properties.server-ipv6=RakNet 绑定的IPv6地址（:: = 所有网卡）
properties.view-distance=玩家视距（区块）
properties.max-players=最大玩家数
properties.language=服务器语言（eng, chs, deu, jpn, rus, vie）
properties.force-language=强制所有客户端使用服务器语言
properties.shutdown-message=服务器关闭时显示给玩家的消息
properties.gamemode=默认游戏模式（0=生存, 1=创造, 2=冒险, 3=旁观）
properties.force-gamemode=玩家加入时重置为默认游戏模式
properties.difficulty=世界难度（0=和平, 1=简单, 2=普通, 3=困难）
properties.hardcore=启用极限模式
properties.pvp=允许玩家对战（PvP）
properties.level-name=默认世界名称
properties.level-seed=默认世界种子（留空 = 随机）
properties.level-type=世界生成器类型（default, flat, nether, the_end, void）
properties.generator-settings=生成器设置（例如超平坦层定义）
properties.spawn-protection=出生点保护半径（格）（0 = 禁用）
properties.white-list=启用白名单
properties.whitelist-reason=非白名单玩家被踢出时显示的消息
properties.xbox-auth=要求 Xbox Live 身份验证
properties.encryption=为 RakNet 会话启用网络加密（NetherNet 始终由 DTLS 保护）
properties.force-resources=强制客户端接受服务器资源包
properties.force-resources-allow-client-packs=强制服务器资源包时仍允许客户端资源包
properties.spawn-animals=生成动物
properties.spawn-mobs=生成敌对生物
properties.allow-flight=允许玩家飞行（关闭时飞行者会被踢出）
properties.auto-save=启用世界自动保存
properties.enable-rcon=启用 RCON 远程控制台
properties.rcon.password=RCON 密码
properties.rcon.port=RCON 端口
properties.enable-query=启用 GameSpy4 查询协议
properties.server-authoritative-movement=移动判定模式（client-auth, server-auth, server-auth-with-rewind）
properties.server-authoritative-block-breaking=由服务端验证方块破坏进度
properties.server-authoritative-inventory=由服务端验证物品栏操作
