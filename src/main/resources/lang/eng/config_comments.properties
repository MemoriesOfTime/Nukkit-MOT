# Nukkit-MOT config comments (nukkit-mot.yml + server.properties) - English

# Category labels
performanceSettings=Performance and threading settings
networkSettings=Network and compression settings
chunkSettings=Chunk loading and ticking settings
entitySettings=Entity spawning and AI settings
worldSettings=World and dimension settings
playerSettings=Player data and interaction settings
debugSettings=Debug, logging and metrics settings
gameFeatureSettings=Game feature toggles
neteaseSettings=NetEase client support settings

# Performance
performanceSettings.asyncWorkers=Number of async worker threads (auto = CPU cores + 1)
performanceSettings.autoTickRate=Automatically adjust tick rate based on server load
performanceSettings.autoTickRateLimit=Maximum tick rate when auto-adjusting
performanceSettings.baseTickRate=Base tick rate (1 = normal speed)
performanceSettings.alwaysTickPlayers=Always tick players even when far from spawn
performanceSettings.threadWatchdog=Enable thread watchdog
performanceSettings.threadWatchdogTick=Thread watchdog check interval (ms)
performanceSettings.doLevelGc=Enable level garbage collection
performanceSettings.ticksPerAutosave=Ticks between auto-saves (6000 = 5 minutes)
performanceSettings.levelAutoCompaction=Enable automatic level compaction
performanceSettings.levelAutoCompactionTicks=Ticks between compaction runs (36000 = 30 minutes)
performanceSettings.leveldbCacheMb=LevelDB cache size in MB
performanceSettings.useNativeLeveldb=Use native LevelDB library
performanceSettings.enableSpark=Enable Spark profiler

# Network
networkSettings.zlibProvider=ZLIB compression provider (2 recommended)
networkSettings.compressionLevel=Compression level (1-9, higher = more CPU, smaller packets)
networkSettings.chunkCompressionLevel=Chunk compression level (1-9, higher = more CPU, smaller chunks)
networkSettings.compressionThreshold=Compression threshold in bytes
networkSettings.useSnappyCompression=Use Snappy compression instead of ZLIB
networkSettings.rakPacketLimit=Max RakNet packets per 10ms per IP
networkSettings.rakCookieMode=RakNet cookie mode (active, offloaded, offloaded_psk, off, none, stateless)
networkSettings.timeoutMilliseconds=Login timeout in milliseconds, also bounds the NetherNet WebRTC handshake phase (30s fallback when 0)
networkSettings.queryPlugins=Show plugin list in query response
networkSettings.useWaterdog=Enable WaterDog proxy mode
networkSettings.viaProxyUsernamePrefix=ViaProxy Java Edition player username prefix
networkSettings.enableProxyProtocol=Enable Proxy Protocol v2 for UDP proxies (e.g. FRP). Whitelisted sources must send a valid PPv2 header; non-whitelisted sources are treated as direct clients
networkSettings.proxyProtocolWhitelist=Whitelisted proxy source IPv4/IPv6 CIDR entries for Proxy Protocol. Use proxy addresses, not player addresses. IPv6 local addresses are trusted by default. Headerless or invalid packets from whitelisted sources are dropped

# NetherNet
networkSettings.netherNetSettings=NetherNet (WebRTC) transport settings, runs alongside RakNet. Restricted-network clients 1.21.90+ join over HTTP signaling + WebRTC
networkSettings.netherNetSettings.enabled=Enabled by default alongside RakNet, set false to disable. Signaling shares the server-port over TCP; WebRTC media pins UDP 19134 (ICE mux, one port serves all peers) via server.properties server-udp-ports, 0 reverts to system-assigned
networkSettings.netherNetSettings.iceServers=Extra ICE STUN/TURN servers, e.g. stun:stun.l.google.com:19302. TURN credentials go in the URL: turn:user:pass@host:port?transport=udp
networkSettings.netherNetSettings.identityFile=Operator identity PEM file, generated on first start, keep it. Changing it makes all returning players re-confirm the trust prompt
networkSettings.netherNetSettings.identityDomain=Operator name in the client trust prompt, empty uses the MOTD

# Chunk
chunkSettings.sendingPerTick=Chunks to send per tick
chunkSettings.tickingPerTick=Chunks to tick per tick
chunkSettings.tickingRadius=Chunk ticking radius around players
chunkSettings.generationQueueSize=Chunk generation queue size
chunkSettings.generationPopulationQueueSize=Chunk population queue size
chunkSettings.lightUpdates=Enable dynamic light updates
chunkSettings.clearChunkTickList=Clear chunk tick list on save
chunkSettings.spawnThreshold=Spawn threshold for chunk loading
chunkSettings.cacheChunks=Cache chunks in memory
chunkSettings.asyncChunks=Use async chunk loading, sending and saving
chunkSettings.maxPendingChunkWrites=Max pending chunk writes per world before unloading pauses (backpressure)

# Entity
entitySettings.spawnEggs=Allow spawn eggs to work
entitySettings.mobAi=Enable mob AI (pathfinding, targeting, etc.)
entitySettings.autoSpawnTask=Enable automatic entity spawning task
entitySettings.despawnTask=Enable automatic entity despawn task
entitySettings.ticksPerSpawns=Ticks between entity spawn attempts
entitySettings.ticksPerDespawns=Ticks between entity despawn checks

# World
worldSettings.nether=Enable the Nether dimension
worldSettings.end=Enable the End dimension
worldSettings.vanillaPortals=Enable vanilla portal mechanics
worldSettings.portalTicks=Ticks to wait in portal before teleporting
worldSettings.multiNetherWorlds=Worlds that should have their own nether dimensions, otherwise using the default nether world
worldSettings.antiXrayWorlds=Worlds where the experimental built-in anti-xray is enabled
worldSettings.doNotTickWorlds=Worlds where random block ticking is disabled
worldSettings.entitySpawningDisabledWorlds=Worlds where entity auto spawning is not allowed
worldSettings.loadAllWorlds=Load all worlds on startup
worldSettings.autoSaveDisabledWorlds=Worlds where level auto-save is disabled
worldSettings.worlds=Per-world custom settings (only configure worlds that need a custom generator/seed)

# Per-world entry fields (under worlds)
worldEntry.generator=World generator type (normal, flat, nether, the_end, void)
worldEntry.seed=World seed (0 = random)
worldEntry.generatorSettings=Generator settings (e.g. flat layer definition)

# Player
playerSettings.savePlayerData=Save player data to disk
playerSettings.savePlayerDataByUuid=Save player data by UUID instead of name
playerSettings.personaSkins=Allow persona skins (custom player models)
playerSettings.skinChangeCooldown=Cooldown for skin changes (seconds)
playerSettings.doNotLimitSkinGeometry=Don't limit skin geometry size
playerSettings.doNotLimitInteractions=Don't limit interaction distance
playerSettings.spaceNameMode=How to handle spaces in usernames (ignore, replace, deny)
playerSettings.xpBottlesOnCreative=Allow XP bottles in creative mode
playerSettings.stopInGame=Allow stopping server from in-game
playerSettings.opInGame=Allow opping players from in-game

# Debug
debugSettings.debugLevel=Debug level (1=errors only, 2=warnings, 3=info)
debugSettings.ansiTitle=Enable ANSI colors in terminal title
debugSettings.deprecatedVerbose=Show verbose deprecation warnings
debugSettings.callDataPkSendEvent=Call DataPacketSendEvent
debugSettings.callBatchPkSendEvent=Call BatchPacketSendEvent
debugSettings.callEntityMotionEvent=Call EntityMotionEvent
debugSettings.blockListener=Enable block listener
debugSettings.automaticBugReport=Enable automatic bug reporting (Sentry)
debugSettings.updateNotifications=Show update notifications
debugSettings.bstatsMetrics=Enable bStats metrics
debugSettings.hastebinToken=Hastebin API token for paste uploads

# Game features
gameFeatureSettings.achievements=Enable achievements
gameFeatureSettings.announcePlayerAchievements=Announce player achievements in chat
gameFeatureSettings.bedSpawnpoints=Allow beds to set spawn points
gameFeatureSettings.explosionBreakBlocks=Allow explosions to break blocks
gameFeatureSettings.dropSpawners=Allow spawners to drop when broken
gameFeatureSettings.anvilsEnabled=Enable anvil usage
gameFeatureSettings.vanillaBossbars=Enable vanilla boss bars
gameFeatureSettings.useClientSpectator=Use client-side spectator mode
gameFeatureSettings.enableExperimentMode=Enable experimental mode features
gameFeatureSettings.multiversionMinProtocol=Minimum protocol version to allow (0 = no limit)
gameFeatureSettings.multiversionMaxProtocol=Maximum protocol version to allow (-1 = no limit)
gameFeatureSettings.enableRawOres=Enable raw ore items
gameFeatureSettings.enableNewPaintings=Enable new painting variants
gameFeatureSettings.enableNewChickenEggsLaying=Enable new chicken egg laying mechanics
gameFeatureSettings.forcedSafetyEnchant=Force safety enchantment checks
gameFeatureSettings.enableVibrantVisuals=Enable vibrant visuals feature
gameFeatureSettings.enableRaytracing=Enable raytracing support
gameFeatureSettings.tempIpBanFailedXboxAuth=Temporarily ban players who fail Xbox authentication
gameFeatureSettings.strongIpBans=Enable stricter IP bans
gameFeatureSettings.checkOpMovement=Check operator movement for cheating
gameFeatureSettings.vanillaArmorReduction=Use vanilla armor damage reduction formula (with toughness/breach/deterministic EPF; disable for legacy linear formula)
gameFeatureSettings.vanillaKnockbackResistance=Apply vanilla armor knockback resistance (each netherite piece resists 10% of knockback; disable for legacy full-strength knockback)

# NetEase
neteaseSettings.clientSupport=Enable NetEase client support
neteaseSettings.onlyAllowNeteaseClient=Only allow NetEase clients

# Custom blocks
customBlockSettings=Custom block settings
customBlockSettings.autoDownloadVanillaPalette=Automatically download vanilla block palettes (vanilla_palette_*.nbt) from the official mirror when missing. Required for custom block support across multiple client protocol versions. Files are cached in the bin/ folder and verified with SHA256. If disabled, you must manually prepare the files in the bin/ folder
customBlockSettings.useHashedBlockNetworkIds=Send hashed block network IDs (blockNetworkIdsHashed) to 1.19.80+ clients, including NetEase clients, instead of legacy runtime IDs. Enabled by default even without custom blocks; hashed IDs are persistent across versions. No effect on protocol < 1.19.80. Always forced on when custom blocks are registered

# server.properties comments
properties.__unrecognized__=The keys below are not used by Nukkit-MOT\nKeep them only if a plugin needs them, otherwise feel free to delete
properties.motd=Server name shown in the server list
properties.sub-motd=Secondary MOTD line (shown in some client server lists)
properties.server-port=Server port: RakNet UDP listener, plus TCP for NetherNet WebRTC signaling when enabled (default 19132)
properties.server-ip=IPv4 address to bind for RakNet UDP and NetherNet TCP signaling (0.0.0.0 = all interfaces)
properties.server-udp-ports=UDP port/window for NetherNet WebRTC media (BDS syntax): default 19134 (one ICE mux port serves all peers), 0 = system-assigned, N or A-B pins a port window, [ip:]ext:int publishes an external mapping. Mapping onto server-port (e.g. 19132:19134) shares RakNet's UDP port: media is relayed in-process to the loopback-bound 19134, so only server-port needs to be open. The internal window must not cover server-port (RakNet) or the IPv6 listener; invalid values abort startup
properties.server-ipv6-port=IPv6 UDP port for RakNet (-1 = disabled)
properties.server-ipv6=IPv6 address to bind for RakNet (:: = all interfaces)
properties.view-distance=View distance in chunks per player
properties.max-players=Maximum number of players allowed
properties.language=Server language (eng, chs, deu, jpn, rus, vie)
properties.force-language=Force the server language on all clients
properties.shutdown-message=Message shown to players when the server shuts down
properties.gamemode=Default game mode (0=survival, 1=creative, 2=adventure, 3=spectator)
properties.force-gamemode=Reset players to the default game mode on join
properties.difficulty=World difficulty (0=peaceful, 1=easy, 2=normal, 3=hard)
properties.hardcore=Enable hardcore mode
properties.pvp=Allow player versus player combat
properties.level-name=Default world name
properties.level-seed=Default world seed (empty = random)
properties.level-type=World generator type (default, flat, nether, the_end, void)
properties.generator-settings=Generator settings (e.g. flat layer definition)
properties.spawn-protection=Spawn protection radius in blocks (0 = disabled)
properties.white-list=Enable the whitelist
properties.whitelist-reason=Kick message shown to non-whitelisted players
properties.xbox-auth=Require Xbox Live authentication
properties.encryption=Enable network encryption for RakNet sessions (NetherNet is always DTLS-secured)
properties.force-resources=Force clients to accept the server resource pack
properties.force-resources-allow-client-packs=Allow client resource packs while forcing server packs
properties.spawn-animals=Spawn animals
properties.spawn-mobs=Spawn hostile mobs
properties.allow-flight=Allow players to fly (kicks flyers when disabled)
properties.auto-save=Enable world auto-save
properties.enable-rcon=Enable the RCON remote console
properties.rcon.password=RCON password
properties.rcon.port=RCON port
properties.enable-query=Enable the GameSpy4 query protocol
properties.server-authoritative-movement=Movement authority mode (client-auth, server-auth, server-auth-with-rewind)
properties.server-authoritative-block-breaking=Server validates block breaking progress
properties.server-authoritative-inventory=Server validates inventory transactions
